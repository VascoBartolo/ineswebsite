# Included inside nginx's http {} block, so the map below is http-level.

# Cache policy by path. Hashed build assets never change under the same name;
# images may be replaced in place; the HTML shell must always be revalidated so
# a deploy is picked up. API responses carry their own policy (empty = no header).
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/images/  "public, max-age=604800";
    ~^/api/     "";
    default     "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Requests reach nginx through the ACA ingress proxy, so compress proxied
    # requests too (gzip_proxied defaults to off).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Every add_header lives here, at server level: nginx drops inherited
    # add_header directives in any location that declares its own.
    add_header Cache-Control $cache_control always;
    # style-src needs 'unsafe-inline' because framer-motion writes inline style
    # attributes. The only inline <script> is JSON-LD, a data block CSP does not block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        # BACKEND_INTERNAL_URL is https:// — the ACA backend ingress terminates TLS
        # and redirects HTTP->HTTPS, so we must proxy over TLS.
        proxy_pass ${BACKEND_INTERNAL_URL};
        proxy_http_version 1.1;
        # Host must be the backend's own FQDN so Azure Container Apps' internal
        # ingress routes to the backend app (not the caller's hostname).
        proxy_set_header Host $proxy_host;
        # Send SNI matching the backend FQDN (required for ACA routing/cert).
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
